name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust ${{ matrix.rust }} and Go compatibility
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: ["1.89.0", stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        run: rustup toolchain install ${{ matrix.rust }} --profile minimal --component rustfmt --component clippy && rustup default ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.24.0"
          cache-dependency-path: tests/oracle/go.sum
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - name: Run format, corruption, I/O, and Go oracle tests
        run: cargo test --locked -- --include-ignored --nocapture
      - run: cargo package --locked
